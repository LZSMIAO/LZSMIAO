name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '43 1 * * *'

permissions:
  contents: write

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Hide only the bottom progress bar
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          for path in Path('dist').glob('*.svg'):
              svg = path.read_text()
              svg = re.sub(r'<rect\b(?=[^>]*\bclass="u(?:\s+[^"]*)?")[^>]*/>', '', svg)
              path.write_text(svg)
          PYCODE
      - name: Publish generated SVGs
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: 'chore: update contribution snake'
