name: Music request tests

on:
  pull_request:
    paths:
      - 'scripts/music_request.mjs'
      - 'scripts/test_music_request.mjs'
      - 'scripts/update_music.mjs'
      - '.github/workflows/music-request-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test scripts/test_music_request.mjs
      - run: node --check scripts/update_music.mjs
