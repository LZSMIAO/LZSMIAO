name: Music request tests

on:
  pull_request:
    paths:
      - 'scripts/music_request.mjs'
      - 'scripts/music_cover.mjs'
      - 'scripts/test_music_cover.mjs'
      - 'scripts/test_music_request.mjs'
      - 'scripts/update_music.mjs'
      - '.github/workflows/music-request-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - run: node --test scripts/test_music_request.mjs scripts/test_music_cover.mjs
      - run: node --check scripts/update_music.mjs
