name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-coding-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
      - name: Fetch the last seven days
        env:
          WAKATIME_ACCESS_TOKEN: ${{ secrets.WAKATIME_ACCESS_TOKEN }}
        run: python3 scripts/update_wakatime.py
      - name: Fetch recent public activity
        if: ${{ !cancelled() }}
        run: python3 scripts/update_activity.py
      - name: Save updated activity
        if: ${{ !cancelled() }}
        run: |
          git add README.md assets/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: update profile activity"
          git pull --rebase --quiet
          git push
